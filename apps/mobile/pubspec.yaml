name: sounddesk_mobile
description: SoundDesk Mobile - local-first music manager.
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.5.0
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  collection: ^1.18.0
  # Add when wiring the real filesystem/download pipeline:
  # path_provider: ^2.1.0   -> default app storage dir
  # file_picker: ^8.0.0     -> "Alterar diretório" (Android SAF / iOS document picker)
  # archive: ^3.6.0         -> building the album .zip
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
